name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        if: hashFiles('backend/pom.xml') != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Dataset sintético em dia com o gerador (ADR-0009)
        run: python3 data/scripts/gerar_dataset_sintetico.py --verificar
      - name: Build & test
        if: hashFiles('backend/pom.xml') != ''
        working-directory: backend
        run: mvn -B verify

  # A API da NVD não terminava em 30 min (~415 mil registros, recomeçando do zero a cada execução). O espelho mantido
  # pelo próprio projeto baixa tudo em minutos, então não precisa de chave nem de cache. Roda semanalmente e sob demanda,
  # sem bloquear merge: quem bloqueia PR é o Trivy. Ele complementa o Trivy porque olha também o JavaScript dentro dos jars.
  dependency-check:
    name: OWASP Dependency-Check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      NVD_ESPELHO: https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz
      DIAS_MAXIMOS_DO_ESPELHO: 7
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: OWASP Dependency-Check
        working-directory: backend
        run: |
          mvn -B -ntp org.owasp:dependency-check-maven:13.0.0:check \
            -DnvdDatafeedUrl="$NVD_ESPELHO" \
            -DossindexAnalyzerEnabled=false \
            -Dformats=HTML,JSON \
            -Dodc.outputDirectory=relatorio-owasp
      # O espelho é atualizado no "melhor esforço": base velha não pode passar como se estivesse em dia.
      - name: Resumir o resultado e conferir a idade da base
        working-directory: backend/relatorio-owasp
        run: |
          atualizada_em=$(jq -r '.scanInfo.dataSource[] | select(.name == "NVD Cache Last Modified") | .timestamp' dependency-check-report.json)
          dias=$(( ($(date +%s) - $(date -d "$atualizada_em" +%s)) / 86400 ))
          {
            echo "### OWASP Dependency-Check"
            echo "Base atualizada em $atualizada_em ($dias dia(s))."
            echo
            echo "| Severidade | CVE | Dependência |"
            echo "|---|---|---|"
            jq -r '[.dependencies[] | .fileName as $arquivo | .vulnerabilities[]? | "| \(.severity) | \(.name) | \($arquivo) |"] | unique | .[]' dependency-check-report.json
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$dias" -gt "$DIAS_MAXIMOS_DO_ESPELHO" ]; then
            echo "::error::A base do espelho da NVD tem $dias dias."
            exit 1
          fi
      - name: Publicar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-owasp
          path: backend/relatorio-owasp
          retention-days: 30

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm run build --if-present
      - name: Testes do frontend (Vitest)
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm test
      - name: npm audit (dependency scanning)
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm audit --audit-level=high

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/default

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['java', 'javascript']
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        if: matrix.language == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Build Java (manual)
        if: matrix.language == 'java'
        working-directory: backend
        run: mvn -B compile -DskipTests
      - uses: github/codeql-action/autobuild@v3
        if: matrix.language != 'java'
      - uses: github/codeql-action/analyze@v3

  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Check obrigatório da regra protect-main: renomear exige mudar a regra junto.
  dependency-scan:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # O Trivy lê os POMs do ~/.m2; sem eles, consultaria o Maven Central e levaria 429 (bloqueio por IP).
      - name: Baixar as dependências do backend
        working-directory: backend
        run: mvn -B -ntp dependency:resolve
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'
          skip-dirs: frontend/node_modules
