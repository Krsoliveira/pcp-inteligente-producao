name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        if: hashFiles('backend/pom.xml') != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Dataset sintético em dia com o gerador (ADR-0009)
        run: python3 data/scripts/gerar_dataset_sintetico.py --verificar
      - name: Build & test
        if: hashFiles('backend/pom.xml') != ''
        working-directory: backend
        run: mvn -B verify

  # A base da NVD (~400 mil CVEs) é lenta e instável: fica fora do job do backend
  # para não travar o PR. Roda semanalmente e sob demanda.
  dependency-check:
    name: OWASP Dependency-Check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Restaurar base NVD
        id: nvd-cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/owasp-nvd
          key: owasp-nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: owasp-nvd-${{ runner.os }}-
      - name: OWASP Dependency-Check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "⚠️  NVD_API_KEY não configurada — OWASP Dependency-Check ignorado."
            echo "Para habilitar, configure o secret NVD_API_KEY em Settings → Secrets."
          else
            mvn -B org.owasp:dependency-check-maven:check \
              -DnvdApiKey="$NVD_API_KEY" \
              -DdataDirectory=/tmp/owasp-nvd \
              -DfailOnError=false
          fi
      # always(): grava o cache parcial mesmo se o timeout cortar o job
      - name: Salvar base NVD
        if: always()
        uses: actions/cache/save@v6
        with:
          path: /tmp/owasp-nvd
          key: owasp-nvd-${{ runner.os }}-${{ github.run_id }}

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm run build --if-present
      - name: Testes do frontend (Vitest)
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm test
      - name: npm audit (dependency scanning)
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm audit --audit-level=high

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/default

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['java', 'javascript']
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        if: matrix.language == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Build Java (manual)
        if: matrix.language == 'java'
        working-directory: backend
        run: mvn -B compile -DskipTests
      - uses: github/codeql-action/autobuild@v3
        if: matrix.language != 'java'
      - uses: github/codeql-action/analyze@v3

  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          skip-dirs: backend,frontend/node_modules
