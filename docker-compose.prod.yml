# Ensaio local do deploy (ADR-0033): as mesmas imagens e o perfil prod, com o arranjo do Railway. O Nginx do frontend
# é a única porta pública e encaminha /api à API pela rede interna. Não é o ambiente de desenvolvimento
# (docker-compose.yml): o banco aqui é outro e começa vazio.
#
# Uso (PowerShell), com segredos só da sessão:
#   $env:JWT_SECRET = -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 48 | ForEach-Object {[char]$_})
#   $env:ADMIN_SENHA = "<senha-de-teste>"
#   docker compose -f docker-compose.prod.yml up -d --build
#   -> http://localhost:8088 (login: admin@pcp.local)
#   docker compose -f docker-compose.prod.yml down -v

name: pcp-prod-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pcp
      POSTGRES_USER: pcp
      POSTGRES_PASSWORD: pcp_prod_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcp -d pcp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pcp
      DB_USER: pcp
      DB_PASSWORD: pcp_prod_local
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (mínimo 32 caracteres)}
      ADMIN_EMAIL: admin@pcp.local
      ADMIN_NOME: Administrador
      ADMIN_SENHA: ${ADMIN_SENHA:?defina ADMIN_SENHA}
      CORS_ORIGINS: http://localhost:8088
      # A rede do Compose usa 172.16.0.0/12: o Nginx daqui é o proxy confiável, como o do Railway lá.
      PROXIES_CONFIAVEIS: 172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_ENDERECO: backend:8080
      BORDA_CONFIAVEL: ${BORDA_CONFIAVEL:-127.0.0.1/32}
    ports:
      - "8088:8080"
