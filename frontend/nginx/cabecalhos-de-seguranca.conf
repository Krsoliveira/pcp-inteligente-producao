# Cabeçalhos de segurança das páginas e arquivos servidos pelo Nginx. As respostas da API (/api) trazem os do
# backend (ConfiguracaoSeguranca). Incluído em cada location: um add_header dentro do location anula os de fora.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# Tudo da própria origem: estilos inline são do MUI (Emotion); a fonte Inter é servida pela aplicação (@fontsource-variable).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
