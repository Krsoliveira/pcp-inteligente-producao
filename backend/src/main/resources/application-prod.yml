# Perfil de produção — sobrescreve application.yml.
# Variáveis obrigatórias que devem existir na plataforma de deploy:
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
#   JWT_SECRET  (mínimo 32 caracteres)
#   CORS_ORIGINS  (URL do frontend, ex.: https://pcp.railway.app)
#   PROXIES_CONFIAVEIS  (opcional) regex dos IPs do proxy reverso; o padrão cobre redes privadas
#   ADMIN_EMAIL, ADMIN_NOME, ADMIN_SENHA  (primeiro usuário GERENTE)

spring:
  jpa:
    show-sql: false

# Atrás de proxy reverso (Railway), o Tomcat aplica X-Forwarded-For/-Proto somente
# quando a conexão vem de um proxy confiável. Sem isso, o IP visto seria o do proxy
# e o HSTS não seria emitido (a requisição chega como HTTP). Confirmar a faixa de IPs
# do proxy da plataforma no primeiro deploy (ADR-0013).
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${PROXIES_CONFIAVEIS:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1}

# Swagger e OpenAPI desabilitados em produção.
# O endpoint /v3/api-docs expõe o mapa completo da API; em produção isso
# representa superfície de ataque desnecessária. Para testar a API em prod,
# use as credenciais JWT diretamente via curl ou Postman.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Ajusta o nível de log para reduzir ruído em produção.
logging:
  level:
    root: WARN
    com.krsoliveira: INFO
    org.flywaydb: INFO