spring:
  application:
    name: pcp-backend

  datasource:
    # Valores padrão casam com o docker-compose da raiz do projeto.
    # Em produção (Render), são sobrescritos por variáveis de ambiente.
    # Porta padrão 5433: casa com o mapeamento do docker-compose
    # (5433 no host -> 5432 no container), evitando conflito com um
    # PostgreSQL nativo eventualmente instalado na máquina.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:pcp}
    username: ${DB_USER:pcp}
    password: ${DB_PASSWORD:pcp_dev}
    hikari:
      # Banco fora do ar responde erro em 5 s, em vez de segurar a requisição pelo padrão de 30 s.
      connection-timeout: 5000

  jpa:
    properties:
      jakarta.persistence.query.timeout: 30000 # ms; também limita a espera por uma ordem bloqueada
    hibernate:
      # O Flyway é o dono do schema; o Hibernate apenas VALIDA se as
      # entidades batem com as tabelas (falha rápido se divergirem).
      ddl-auto: validate
    open-in-view: false

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{requestId:--}] %-5level %logger{36} - %msg%n"

server:
  # Tamanho máximo dos headers (8KB já é o padrão do Tomcat; explícito para documentar).
  max-http-request-header-size: 8KB
  tomcat:
    # Valem só para formulários (application/x-www-form-urlencoded) e para o corpo que o
    # Tomcat descarta ao abortar uma requisição. NÃO limitam o corpo JSON da API: esse
    # limite é do LimiteTamanhoCorpoFilter (pcp.seguranca.corpo-maximo-bytes).
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB

pcp:
  # "Hoje" da operação: validade de lote, atraso de ordem e filtros por data.
  fuso-horario: ${FUSO_HORARIO:America/Sao_Paulo}
  seguranca:
    # Corpo máximo aceito em POST/PUT/PATCH, em bytes (1 MB).
    corpo-maximo-bytes: 1048576

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Precisa acompanhar o webjar fixado no pom.xml: o springdoc procura os arquivos na pasta
    # da versão com que foi compilado e responde 404 se ela não existir.
    version: 5.34.1

app:
  jwt:
    # Mínimo 32 caracteres para HS256. Em produção, sobrescreva com JWT_SECRET.
    secret: ${JWT_SECRET:minha-chave-secreta-de-dev-com-mais-de-32-chars-nao-use-em-producao}
    # 8 horas em milissegundos (padrão). Sobrescreva com JWT_EXPIRACAO_MS.
    expiracao-ms: ${JWT_EXPIRACAO_MS:28800000}
  # Administrador inicial (perfil Administrador), criado na inicialização se ADMIN_EMAIL
  # estiver definido. As credenciais vêm SOMENTE do ambiente — nunca do Git.
  admin:
    nome: ${ADMIN_NOME:}
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
