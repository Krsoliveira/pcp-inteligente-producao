# Contorno para Docker Engine 29 + Testcontainers 1.x:
# o docker-java embutido negocia API 1.32 por padrao, e o Engine 29 exige >= 1.44,
# respondendo 400 ("Could not find a valid Docker environment").
# Ver https://github.com/testcontainers/testcontainers-java/issues/11235
# Remover quando migrarmos para Testcontainers 2.x (negociacao automatica).
api.version=1.44
